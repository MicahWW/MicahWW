version: 2
updates:
  - package-ecosystem: devcontainers
    assignees:
      - MicahWW
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: github-actions
    assignees:
      - MicahWW
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: npm
    assignees:
      - MicahWW
    directory: /
    schedule:
      interval: monthly
    groups:
      next:
        applies-to: version-updates
        patterns:
          - next
          - eslint-config-next
      react:
        applies-to: version-updates
        patterns:
          - '@types/react*'
        update-types:
          - patch
          - minor
        