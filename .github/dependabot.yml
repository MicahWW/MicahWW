version: 2
updates:
  - package-ecosystem: devcontainers
    assignees:
      - MicahWW
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: github-actions
    assignees:
      - MicahWW
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: npm
    assignees:
      - MicahWW
    directory: /
    schedule:
      interval: monthly
    groups:
      next:
        patterns:
          - next
          - eslint-config-next
      react:
        patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
      tailwind:
        patterns:
          - tailwindcss
          - '@tailwindcss/postcss'
