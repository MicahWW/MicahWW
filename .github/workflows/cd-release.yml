name: Generate and push new tag

on:
  workflow_dispatch:

permissions:
  contents: write # required for pushing tags & publishing releases
  id-token: write # required for OIDC authentication

jobs:
  CalVer-Creation:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.publish_release_and_tag.outputs.new_version }}

    steps:
      - name: Publish release and tag
        id: publish_release_and_tag
        uses: MicahWW/CalVer-Creation@v1
        with:
          set_build_metadata: 'false'
          timezone: 'America/Chicago'
          push_tag: 'true'
          publish_release: 'true'
          github_token: ${{ secrets.GITHUB_TOKEN }}

  build:
    uses: ./.github/workflows/reuseable-build-nextjs.yml
    with:
      node-version: '24'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.APP_NAME }}
          slot-name: ${{ vars.SLOT_NAME }}
          package: .
